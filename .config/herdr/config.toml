onboarding = false
[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
sidebar_max_width = 44

[ui.sidebar.agents]
rows = [["state_icon", "workspace"], ["agent"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["$pr"]]

[[keys.command]]
key = "prefix+shift+k"
type = "plugin_action"
command = "worktree-cleanup.remove"
description = "remove worktree (with orphan recovery)"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "gh-pr.open-pr"
description = "open PR in browser"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "pr-mirror.refresh"
description = "refresh PR status"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer (split)"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer (tab)"

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[ui.sound]
enabled = true
